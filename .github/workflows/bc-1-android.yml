name: BC-1 Android build and GPU checks
on:
  push:
    branches: [bc-1-v0.2-ui, bc-1-v0.3-effects, bc-1-v0.4-timeline, bc-1-v0.5-motion, bc-1-v1.0, bc-1-v1.0.1-ui, bc-1-v1.0.2-media, bc-1-v1.0.3-thumbnails, bc-1-export-reliability, bc-1-v1.0.4-diagnostics]
    paths: ['BC-1/**', '.github/workflows/bc-1-android.yml', '.github/scripts/bc1-*.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Install media test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg ripgrep
      - name: Generate deterministic video and audio fixtures
        run: bash .github/scripts/bc1-media-fixtures.sh
      - name: Unit tests, lint, APK and GPU test APK
        working-directory: BC-1
        run: gradle --no-daemon -Pbc1SideBySide testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: BC-1-v1.0.4-apk
          path: BC-1/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BC-1-build-reports
          path: BC-1/app/build/reports/
  gpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install media test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg ripgrep
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/bc1-device-checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BC-1-GPU-test-reports
          path: BC-1/app/build/reports/androidTests/

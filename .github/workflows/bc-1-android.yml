name: BC-1 v0.1 Android APK
on:
  push:
    branches: [bc-1-v0.1]
    paths:
      - 'BC-1/**'
      - '.github/workflows/bc-1-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests and build Android APK
        working-directory: BC-1
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BC-1-v0.1-debug-apk
          path: BC-1/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

plugins { id 'com.android.application' }

android {
    namespace 'com.blackice.bc1'
    compileSdk 36

    defaultConfig {
        applicationId 'com.blackice.bc1'
        // Use a parallel preview install when the earlier signing key is unavailable.
        if (project.hasProperty('bc1SideBySide')) applicationIdSuffix '.preview'
        manifestPlaceholders = [appLabel: project.hasProperty('bc1SideBySide') ? 'BC-1 v2.0.0' : 'BC-1 Dual Workspace']
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '2.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media3:media3-transformer:1.11.1'
    implementation 'androidx.media3:media3-effect:1.11.1'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM tests of project / preset encoding (android.jar only has stubs).
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

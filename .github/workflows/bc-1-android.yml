name: BC-1 v0.2 Android APK
on:
  push:
    branches: [bc-1-v0.2-ui]
    paths:
      - 'BC-1/**'
      - '.github/workflows/bc-1-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests and Android debug APK
        working-directory: BC-1
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BC-1-v0.2-ui-debug-apk
          path: BC-1/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

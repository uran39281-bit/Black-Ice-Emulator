plugins { id 'com.android.application' }

android {
    namespace 'com.blackice.bc1'
    compileSdk 35

    defaultConfig {
        applicationId 'com.blackice.bc1'
        // Use a parallel preview install when the earlier signing key is unavailable.
        if (project.hasProperty('bc1SideBySide')) applicationIdSuffix '.preview'
        manifestPlaceholders = [appLabel: project.hasProperty('bc1SideBySide') ? 'BC-1 v0.3 Preview' : 'BC-1 Dual Workspace']
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
